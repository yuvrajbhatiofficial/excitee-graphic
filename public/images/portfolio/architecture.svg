<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="concreteWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="shadowCast" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="900" height="1600" fill="url(#skyGrad)" />

  <!-- Brutalist Architecture Monoliths -->
  <!-- Tower 1 -->
  <polygon points="120,400 420,180 420,1600 120,1600" fill="url(#concreteWall)" />
  <polygon points="420,180 780,360 780,1600 420,1600" fill="url(#shadowCast)" />

  <!-- Sun cut cantilever -->
  <polygon points="260,650 680,820 680,1100 260,930" fill="#f8fafc" opacity="0.9" />
  <polygon points="260,930 680,1100 680,1280 260,1110" fill="#0f172a" opacity="0.85" />

  <!-- Architectural grid lines & perspective guides -->
  <line x1="420" y1="180" x2="420" y2="1600" stroke="#f1f5f9" stroke-width="3" />
  <line x1="220" y1="500" x2="220" y2="1600" stroke="#64748b" stroke-width="1" stroke-dasharray="6 6" />
  <line x1="620" y1="460" x2="620" y2="1600" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Minimal Swiss Architectural Typography watermark -->
  <g font-family="'Clash Display', 'Satoshi', sans-serif" fill="#ffffff" opacity="0.85">
    <text x="80" y="1480" font-size="36" font-weight="700" letter-spacing="-1">02 / STRUCTURE</text>
    <text x="80" y="1520" font-size="16" font-family="'Satoshi', sans-serif" letter-spacing="4" opacity="0.7">ELEVATION STUDY 28°N</text>
  </g>
</svg>
